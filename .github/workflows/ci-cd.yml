
name: MCA CI CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-deploy:
    runs-on: self-hosted

    env:
      IMAGE_NAME: kopurikarthik00/mca-ci-cd-app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Tests
        run: |
          python -m unittest -v test_app.py

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            kopurikarthik00/mca-ci-cd-app:latest
            kopurikarthik00/mca-ci-cd-app:${{ github.sha }}

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml

          kubectl set image deployment/mca-ci-cd-app \
            app=kopurikarthik00/mca-ci-cd-app:${{ github.sha }}

          kubectl rollout status deployment/mca-ci-cd-app \
            --timeout=180s

      - name: Verify Deployment
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services
