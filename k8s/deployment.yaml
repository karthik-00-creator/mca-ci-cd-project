
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mca-ci-cd-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mca-ci-cd-app
  template:
    metadata:
      labels:
        app: mca-ci-cd-app
    spec:
      containers:
        - name: app
          image: kopurikarthik00/mca-ci-cd-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mca-ci-cd-service
spec:
  type: NodePort
  selector:
    app: mca-ci-cd-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
